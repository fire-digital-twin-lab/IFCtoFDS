name: Production container contract

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'feat/production-deployment-stack'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IFCFDS_PUBLIC_HOST: ifctofds.example.org
      IFCFDS_API_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef
      IFCFDS_API_KEY_FILE: /tmp/ifctofds-api-key
      IFCFDS_TLS_CERT_DIR: /tmp/ifctofds-tls
      IFCFDS_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4

      - name: Prepare non-secret CI placeholders
        run: |
          printf '%s' "$IFCFDS_API_KEY" > "$IFCFDS_API_KEY_FILE"
          mkdir -p "$IFCFDS_TLS_CERT_DIR"

      - name: Validate compose expansion
        run: docker compose -f compose.production.yml config --quiet

      - name: Build runtime image
        run: docker build --pull --tag ifctofds:ci .

      - name: Production startup must fail without API key
        shell: bash
        run: |
          set +e
          timeout 15s docker run --rm \
            -e IFCFDS_ENV=production \
            -e IFCFDS_ALLOWED_HOSTS=ifctofds.example.org \
            ifctofds:ci
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 0 ]; then
            echo "Container did not fail closed when IFCFDS_API_KEY was missing"
            exit 1
          fi

      - name: Start application container
        run: |
          docker run -d --name ifctofds-ci \
            -e IFCFDS_ENV=production \
            -e IFCFDS_ALLOWED_HOSTS=ifctofds.example.org,127.0.0.1 \
            -e IFCFDS_ALLOWED_ORIGINS=https://ifctofds.example.org \
            -e IFCFDS_API_KEY="$IFCFDS_API_KEY" \
            -e IFCFDS_JOB_ROOT=/var/lib/ifctofds/jobs \
            -p 127.0.0.1:18000:8000 \
            ifctofds:ci

      - name: Probe health and static workbench
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent -H 'Host: ifctofds.example.org' http://127.0.0.1:18000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs ifctofds-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent -H 'Host: ifctofds.example.org' http://127.0.0.1:18000/ >/dev/null
          curl --fail --silent \
            -H 'Host: ifctofds.example.org' \
            -H "X-API-Key: $IFCFDS_API_KEY" \
            http://127.0.0.1:18000/api/scheduler-health >/dev/null

      - name: Prepare TLS fixture for full Compose stack
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$IFCFDS_TLS_CERT_DIR/privkey.pem" \
            -out "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            -subj "/CN=ifctofds.example.org" \
            -addext "subjectAltName=DNS:ifctofds.example.org"
          sudo chown root:root \
            "$IFCFDS_TLS_CERT_DIR/privkey.pem" \
            "$IFCFDS_TLS_CERT_DIR/fullchain.pem"
          sudo chmod 0600 "$IFCFDS_TLS_CERT_DIR/privkey.pem"
          sudo chmod 0644 "$IFCFDS_TLS_CERT_DIR/fullchain.pem"

      - name: Start full TLS reverse-proxy stack
        run: |
          docker rm -f ifctofds-ci
          docker compose -f compose.production.yml up -d --no-build
          docker compose -f compose.production.yml ps

      - name: Smoke TLS, redirect, auth and security headers through proxy
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --noproxy '*' \
              --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
              --resolve ifctofds.example.org:443:127.0.0.1 \
              https://ifctofds.example.org/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f compose.production.yml logs
              exit 1
            fi
            sleep 1
          done

          redirect="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --noproxy '*' -H 'Host: ifctofds.example.org' http://127.0.0.1/)"
          test "$redirect" = "308"

          unauth="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --noproxy '*' \
            --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            --resolve ifctofds.example.org:443:127.0.0.1 \
            https://ifctofds.example.org/api/scheduler-health)"
          test "$unauth" = "401"

          curl --fail --silent --noproxy '*' \
            --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            --resolve ifctofds.example.org:443:127.0.0.1 \
            -H "X-API-Key: $IFCFDS_API_KEY" \
            -D /tmp/ifctofds-headers.txt \
            https://ifctofds.example.org/api/scheduler-health >/dev/null
          grep -qi '^strict-transport-security: max-age=31536000' /tmp/ifctofds-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/ifctofds-headers.txt

      - name: Verify production smoke CLI against HTTPS stack
        env:
          SSL_CERT_FILE: /tmp/ifctofds-tls/fullchain.pem
          NO_PROXY: ifctofds.example.org
        run: |
          echo "127.0.0.1 ifctofds.example.org" | sudo tee -a /etc/hosts
          python scripts/production-smoke.py \
            --base-url https://ifctofds.example.org \
            --api-key-file "$IFCFDS_API_KEY_FILE"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs ifctofds-ci 2>/dev/null || true
          docker compose -f compose.production.yml logs || true

      - name: Stop test stack
        if: always()
        run: docker compose -f compose.production.yml down --volumes --remove-orphans || true
