name: Production container contract

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'feat/production-deployment-stack'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IFCFDS_PUBLIC_HOST: ifctofds.example.org
      IFCFDS_API_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef
      IFCFDS_API_KEY_FILE: /tmp/ifctofds-secrets/api-key
      IFCFDS_SMOKE_API_KEY_FILE: /tmp/ifctofds-smoke-api-key
      IFCFDS_TLS_CERT_DIR: /tmp/ifctofds-tls
      IFCFDS_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4

      - name: Prepare non-secret CI placeholders
        run: |
          # File-backed Compose secrets giữ nguyên UID/GID/mode của Linux host.
          # Không dùng file world-readable chỉ để container chạy được.
          sudo install -d -o root -g root -m 0755 /tmp/ifctofds-secrets
          printf '%s' "$IFCFDS_API_KEY" | sudo tee "$IFCFDS_API_KEY_FILE" >/dev/null
          sudo chown root:10001 "$IFCFDS_API_KEY_FILE"
          sudo chmod 0640 "$IFCFDS_API_KEY_FILE"
          # Bản sao test-only cho smoke CLI chạy với quyền runner, không mount vào app.
          printf '%s' "$IFCFDS_API_KEY" > "$IFCFDS_SMOKE_API_KEY_FILE"
          chmod 0600 "$IFCFDS_SMOKE_API_KEY_FILE"
          mkdir -p "$IFCFDS_TLS_CERT_DIR"

      - name: Validate compose expansion
        run: docker compose -f compose.production.yml config --quiet

      - name: Build runtime image
        run: docker build --pull --tag ifctofds:ci .

      - name: Verify exact Debian security package versions inside production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --entrypoint sh ifctofds:ci -ec '
            test "$(dpkg-query -W -f="${Version}" apt)" = "3.0.4"
            test "$(dpkg-query -W -f="${Version}" libapt-pkg7.0)" = "3.0.4"
            test "$(dpkg-query -W -f="${Version}" zlib1g)" = "1:1.3.dfsg+really1.3.1-1+deb13u1"
          '

      - name: Validate file-backed secret ownership and container isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo python scripts/production-secret-preflight.py --file "$IFCFDS_API_KEY_FILE"

          # App UID/GID 10001 phải đọc được file root:10001, 0640.
          docker compose -f compose.production.yml run --rm --no-deps \
            --entrypoint python app -c \
            'import os; from pathlib import Path; assert (os.geteuid(), os.getegid()) == (10001, 10001); assert len(Path("/run/secrets/api_key").read_text(encoding="utf-8").strip()) >= 32'

          # UID/GID không được cấp quyền không được đọc cùng secret.
          docker compose -f compose.production.yml run --rm --no-deps \
            --user 10002:10002 --entrypoint python app -c \
            'import os; assert not os.access("/run/secrets/api_key", os.R_OK)'

          # File root:root 0600 phải thất bại khi chạy dưới UID 10001.
          printf '%s' "$IFCFDS_API_KEY" | sudo tee /tmp/ifctofds-secrets/unreadable >/dev/null
          sudo chown root:root /tmp/ifctofds-secrets/unreadable
          sudo chmod 0600 /tmp/ifctofds-secrets/unreadable
          IFCFDS_API_KEY_FILE=/tmp/ifctofds-secrets/unreadable \
            docker compose -f compose.production.yml run --rm --no-deps \
              --entrypoint python app -c \
              'import os; assert not os.access("/run/secrets/api_key", os.R_OK)'
          if sudo python scripts/production-secret-preflight.py \
            --file /tmp/ifctofds-secrets/unreadable; then
            echo "Root-only file unexpectedly passed secret metadata preflight"
            exit 1
          fi

      - name: Production startup must fail without API key
        shell: bash
        run: |
          set +e
          timeout 15s docker run --rm \
            -e IFCFDS_ENV=production \
            -e IFCFDS_ALLOWED_HOSTS=ifctofds.example.org \
            ifctofds:ci
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 0 ]; then
            echo "Container did not fail closed when IFCFDS_API_KEY was missing"
            exit 1
          fi

      - name: Start application container
        run: |
          docker run -d --name ifctofds-ci \
            -e IFCFDS_ENV=production \
            -e IFCFDS_ALLOWED_HOSTS=ifctofds.example.org,127.0.0.1 \
            -e IFCFDS_ALLOWED_ORIGINS=https://ifctofds.example.org \
            -e IFCFDS_API_KEY="$IFCFDS_API_KEY" \
            -e IFCFDS_JOB_ROOT=/var/lib/ifctofds/jobs \
            -p 127.0.0.1:18000:8000 \
            ifctofds:ci

      - name: Probe health and static workbench
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent -H 'Host: ifctofds.example.org' http://127.0.0.1:18000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs ifctofds-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent -H 'Host: ifctofds.example.org' http://127.0.0.1:18000/ >/dev/null
          curl --fail --silent \
            -H 'Host: ifctofds.example.org' \
            -H "X-API-Key: $IFCFDS_API_KEY" \
            http://127.0.0.1:18000/api/scheduler-health >/dev/null

      - name: Prepare TLS fixture for full Compose stack
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$IFCFDS_TLS_CERT_DIR/privkey.pem" \
            -out "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            -subj "/CN=ifctofds.example.org" \
            -addext "subjectAltName=DNS:ifctofds.example.org"
          sudo chown root:root \
            "$IFCFDS_TLS_CERT_DIR/privkey.pem" \
            "$IFCFDS_TLS_CERT_DIR/fullchain.pem"
          sudo chmod 0600 "$IFCFDS_TLS_CERT_DIR/privkey.pem"
          sudo chmod 0644 "$IFCFDS_TLS_CERT_DIR/fullchain.pem"

      - name: Start full TLS reverse-proxy stack
        run: |
          docker rm -f ifctofds-ci
          docker compose -f compose.production.yml up -d --no-build
          docker compose -f compose.production.yml ps

      - name: Smoke TLS, redirect, auth and security headers through proxy
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --noproxy '*' \
              --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
              --resolve ifctofds.example.org:443:127.0.0.1 \
              https://ifctofds.example.org/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f compose.production.yml logs
              exit 1
            fi
            sleep 1
          done

          redirect="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --noproxy '*' -H 'Host: ifctofds.example.org' http://127.0.0.1/)"
          test "$redirect" = "308"

          unauth="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --noproxy '*' \
            --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            --resolve ifctofds.example.org:443:127.0.0.1 \
            https://ifctofds.example.org/api/scheduler-health)"
          test "$unauth" = "401"

          curl --fail --silent --noproxy '*' \
            --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            --resolve ifctofds.example.org:443:127.0.0.1 \
            -H "X-API-Key: $IFCFDS_API_KEY" \
            -D /tmp/ifctofds-headers.txt \
            https://ifctofds.example.org/api/scheduler-health >/dev/null
          grep -qi '^strict-transport-security: max-age=31536000' /tmp/ifctofds-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/ifctofds-headers.txt

      - name: Reject forged Host and unknown SNI through proxy
        shell: bash
        run: |
          set -euo pipefail
          # Host hợp lệ vẫn nhận redirect 308 tới hostname canonical và giữ path/query.
          headers="$(mktemp)"
          code="$(curl --silent --noproxy '*' --max-time 5 \
            --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
            -H 'Host: ifctofds.example.org' 'http://127.0.0.1/hello?x=1')"
          test "$code" = "308"
          tr -d '\r' < "$headers" | grep -Fqx 'Location: https://ifctofds.example.org/hello?x=1'

          # NGINX default server trả 444 (curl thấy 000), không chuyển hướng Host do client đặt.
          for invalid_host in attacker.example.org ifctofds.example.org.attacker.test; do
            code="$(curl --http1.1 --silent --noproxy '*' --max-time 5 \
              --output /dev/null --write-out '%{http_code}' \
              -H "Host: $invalid_host" http://127.0.0.1/hello || true)"
            test "$code" = "000"
          done
          code="$(curl --http1.0 --silent --noproxy '*' --max-time 5 \
            --output /dev/null --write-out '%{http_code}' \
            -H 'Host:' http://127.0.0.1/hello || true)"
          test "$code" = "000"

          # Đúng SNI nhưng Host sai phải bị 421, không được proxy vào app.
          code="$(curl --http1.1 --silent --noproxy '*' --max-time 5 \
            --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            --resolve ifctofds.example.org:443:127.0.0.1 \
            --output /dev/null --write-out '%{http_code}' \
            -H 'Host: attacker.example.org' \
            https://ifctofds.example.org/api/health || true)"
          test "$code" = "421"

          # SNI không khớp không được thiết lập kết nối TLS ngay cả khi client tin CA test.
          if timeout 8s openssl s_client -connect 127.0.0.1:443 \
            -servername attacker.example.org \
            -CAfile "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            -verify_return_error -brief </dev/null >/tmp/ifctofds-unknown-sni.txt 2>&1; then
            echo "Unexpected TLS handshake success for unknown SNI"
            exit 1
          fi

      - name: Verify production smoke CLI against HTTPS stack
        env:
          SSL_CERT_FILE: /tmp/ifctofds-tls/fullchain.pem
          NO_PROXY: ifctofds.example.org
        run: |
          echo "127.0.0.1 ifctofds.example.org" | sudo tee -a /etc/hosts
          python scripts/production-smoke.py \
            --base-url https://ifctofds.example.org \
            --api-key-file "$IFCFDS_SMOKE_API_KEY_FILE"

      - name: Verify real IFC conversion and persisted artifacts through HTTPS
        shell: bash
        env:
          SSL_CERT_FILE: /tmp/ifctofds-tls/fullchain.pem
          NO_PROXY: ifctofds.example.org
        run: |
          set -euo pipefail
          python scripts/production-conversion-e2e.py create \
            --base-url https://ifctofds.example.org \
            --api-key-file "$IFCFDS_SMOKE_API_KEY_FILE" \
            --fixture tests/baseline/fixtures/tiny.ifc \
            --evidence /tmp/ifctofds-production-e2e-evidence.json \
            --job-timeout 180
          docker compose -f compose.production.yml up -d --force-recreate --no-build app proxy
          python scripts/production-conversion-e2e.py verify \
            --base-url https://ifctofds.example.org \
            --api-key-file "$IFCFDS_SMOKE_API_KEY_FILE" \
            --evidence /tmp/ifctofds-production-e2e-evidence.json

      - name: Verify secret rotation revokes old key after container restart
        shell: bash
        run: |
          set -euo pipefail
          # Fixture giả, chỉ dùng trong CI; không in key ra log.
          rotated_key=abcdef0123456789abcdef0123456789abcdef0123456789
          printf '%s' "$rotated_key" | sudo tee "$IFCFDS_API_KEY_FILE" >/dev/null
          sudo chown root:10001 "$IFCFDS_API_KEY_FILE"
          sudo chmod 0640 "$IFCFDS_API_KEY_FILE"
          sudo python scripts/production-secret-preflight.py --file "$IFCFDS_API_KEY_FILE"

          # Key được nạp lúc app startup, rotation yêu cầu recreate container.
          docker compose -f compose.production.yml up -d --force-recreate --no-build

          # Sau recreate: key mới hợp lệ, key cũ phải HTTP 401.
          ready=0
          for attempt in {1..30}; do
            code="$(curl --silent --noproxy '*' --max-time 5 \
              --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
              --resolve ifctofds.example.org:443:127.0.0.1 \
              -H "X-API-Key: $rotated_key" \
              --output /dev/null --write-out '%{http_code}' \
              https://ifctofds.example.org/api/scheduler-health || true)"
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          old_key_status="$(curl --silent --noproxy '*' --max-time 5 \
            --cacert "$IFCFDS_TLS_CERT_DIR/fullchain.pem" \
            --resolve ifctofds.example.org:443:127.0.0.1 \
            -H "X-API-Key: $IFCFDS_API_KEY" \
            --output /dev/null --write-out '%{http_code}' \
            https://ifctofds.example.org/api/scheduler-health)"
          test "$old_key_status" = "401"

      - name: Verify offline backup and restore into a new named volume
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-volume-maintenance.sh
          sudo install -d -o 10001 -g 10001 -m 0700 /tmp/ifctofds-volume-backups

          # Chặn backup khi production app vẫn mount volume.
          if bash scripts/production-volume-maintenance.sh backup \
            ifctofds:ci /tmp/ifctofds-volume-backups ci-backup; then
            echo "Online backup unexpectedly succeeded"
            exit 1
          fi
          docker compose -f compose.production.yml stop proxy app

          # Tạo job terminal + artifact thật trên volume, sau khi app/worker đã dừng.
          docker run --rm --user 10001:10001 \
            --mount type=volume,source=ifctofds_jobs,target=/var/lib/ifctofds/jobs \
            ifctofds:ci python -c '
          from pathlib import Path
          import time
          from ifc_to_fds.adapters.jobs.repository import JobRepository
          root = Path("/var/lib/ifctofds/jobs")
          directory = root / "job-maintenance-fixture"
          directory.mkdir()
          (directory / "result.json").write_text("{\"status\":\"INCONCLUSIVE\"}", encoding="utf-8")
          now = time.time()
          JobRepository(root=root).register("maintenance-fixture", dict(
              id="maintenance-fixture", state="COMPLETED", mode="convert",
              directory=str(directory), created=now - 100, started=now - 90,
              finished=now - 10, last_accessed=now, process=None
          ))
          '

          bash scripts/production-volume-maintenance.sh backup \
            ifctofds:ci /tmp/ifctofds-volume-backups ci-backup
          bash scripts/production-volume-maintenance.sh restore \
            ifctofds:ci /tmp/ifctofds-volume-backups ci-backup \
            ifctofds_jobs_restore_ci

          # Kiểm chứng cả job E2E trước đó và fixture bảo trì sau restore.
          docker run --rm --user 10001:10001 \
            --mount type=volume,source=ifctofds_jobs_restore_ci,target=/var/lib/ifctofds/jobs \
            --mount type=bind,source=/tmp/ifctofds-production-e2e-evidence.json,target=/tmp/ifctofds-e2e.json,readonly \
            ifctofds:ci python -c '
          from pathlib import Path
          import hashlib
          import json
          from ifc_to_fds.adapters.jobs.repository import JobRepository
          root = Path("/var/lib/ifctofds/jobs")
          repo = JobRepository(root=root)
          job = repo.get("maintenance-fixture")
          assert job is not None and job["state"] == "COMPLETED"
          assert job["directory"] == str(root / "job-maintenance-fixture")
          assert (root / "job-maintenance-fixture" / "result.json").read_text(encoding="utf-8") == "{\"status\":\"INCONCLUSIVE\"}"
          evidence = json.loads(Path("/tmp/ifctofds-e2e.json").read_text(encoding="utf-8"))
          actual_job = repo.get(evidence["job_id"])
          assert actual_job is not None and actual_job["state"] == "COMPLETED"
          directory = Path(actual_job["directory"])
          assert directory.parent == root and directory.is_dir()
          for kind, filename in {"manifest": "model_manifest.json", "fds": "model.fds", "geometry": "model_geometry.json"}.items():
              actual_hash = hashlib.sha256((directory / filename).read_bytes()).hexdigest()
              assert actual_hash == evidence["artifact_sha256"][kind]
          marker = json.loads((root / ".restore-verified.json").read_text(encoding="utf-8"))
          assert marker["job_count"] == 2
          '
          # Không được restore lần nữa vào cùng volume đã có dữ liệu.
          if bash scripts/production-volume-maintenance.sh restore \
            ifctofds:ci /tmp/ifctofds-volume-backups ci-backup \
            ifctofds_jobs_restore_ci; then
            echo "Restore unexpectedly overwrote an existing named volume"
            exit 1
          fi

      - name: Cleanup isolated CI restore volume
        if: always()
        run: docker volume rm ifctofds_jobs_restore_ci 2>/dev/null || true

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs ifctofds-ci 2>/dev/null || true
          docker compose -f compose.production.yml logs || true

      - name: Stop test stack
        if: always()
        run: docker compose -f compose.production.yml down --volumes --remove-orphans || true
