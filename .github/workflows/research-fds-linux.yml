name: Inspect official FDS 6.11.1 Linux bundle

on:
  push:
    branches:
      - research/fds-6.11.1-linux-bundle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download pinned official bundle
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/firemodels/fds/releases/download/FDS-6.11.1/FDS-6.11.1_SMV-6.11.2_lnx.sh"
          bundle="$RUNNER_TEMP/fds-linux.sh"
          curl --fail --location --retry 4 --retry-all-errors --output "$bundle" "$url"
          echo "ba8793b974150fdb778b3db0b69ab8db4e4668d5c52987a317e7f5ed58102ea0  $bundle" | sha256sum --check
          chmod +x "$bundle"
          echo "BUNDLE_SHA=$(sha256sum "$bundle" | awk '{print $1}')"

      - name: Inspect installer help
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fds-linux.sh" --help 2>&1 | head -120 || true

      - name: Extract without installation side effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fds-extract"
          "$RUNNER_TEMP/fds-linux.sh" --noexec --target "$RUNNER_TEMP/fds-extract"
          find "$RUNNER_TEMP/fds-extract" -maxdepth 6 -type f \
            \( -name 'fds' -o -name 'fds_openmp' -o -name 'fds_*' \) \
            -print | sort
          while IFS= read -r binary; do
            echo "BINARY=$binary"
            sha256sum "$binary"
            file "$binary"
            "$binary" -v 2>&1 | head -40 || true
          done < <(find "$RUNNER_TEMP/fds-extract" -maxdepth 6 -type f \
            \( -name 'fds' -o -name 'fds_openmp' \) -print | sort)
