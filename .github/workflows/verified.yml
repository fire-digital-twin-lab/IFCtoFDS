name: Conversion correctness
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      research:
        description: Run private externally configured research acceptance
        type: boolean
        default: false

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev --extra test
      - run: uv run --locked --extra test python -m pytest -q -m "not solver and not browser"
      - run: uv run --locked --extra test python -m ifc_to_fds --help
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/app-controller.js
      - run: node --check js/verified-workflow.js
      - run: node scripts/test-worker-bundle-parity.js
      - run: node scripts/test-golden-workflow.js
      - run: node scripts/test-artifact-viewer.js
      - run: node scripts/test-verified-regressions.js
      - run: node scripts/test-geom-opening-regression.js
      - run: node scripts/test-background-export-worker.js
      - run: node scripts/test-large-opening.js
      - run: node scripts/test-workbench-stabilization.js
      - run: node scripts/test-ui-recovery.js
      - run: node scripts/test-artifact-downloads.js
      - run: node scripts/test-legacy-geom-compatibility.js
      - run: node scripts/generate-inline-parse-worker.js
      - run: node scripts/generate-inline-export-worker.js
      - run: git diff --exit-code -- js/workers/*-inline.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev --extra test --extra browser
      - run: uv run --locked --extra test --extra browser python -m playwright install --with-deps chromium
      - run: uv run --locked --extra test --extra browser python -m pytest -q -m browser --junitxml=scripts/out/browser-conversion/workbench.xml
      - run: uv run --locked --extra test --extra browser python scripts/test-conversion-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: scripts/out/browser-conversion/
  solver:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev --extra test
      - run: python scripts/install-fds.py
      - name: Real pinned FDS and boundary fixtures
        shell: pwsh
        run: |
          $env:IFCFDS_SOLVER = (Resolve-Path '.deps/fds-6.11.1/firemodels/FDS6/bin/fds_openmp.exe').Path
          uv run --locked --extra test python -m pytest -q -m solver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solver-evidence
          include-hidden-files: true
          path: |
            scripts/out/solver-evidence/
            .cache/solver-evidence/

  research:
    if: github.event_name == 'workflow_dispatch' && inputs.research
    runs-on: [self-hosted, ifc-research]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev --extra test
      - name: Verify external reference (missing data must not pass)
        shell: pwsh
        run: uv run --locked --extra test python scripts/run-external-reference.py --case "$env:IFCFDS_RESEARCH_CASE" --source-map "$env:IFCFDS_RESEARCH_SOURCE_MAP" --config "$env:IFCFDS_RESEARCH_CONFIG" --output .local-reference-cases/research-run
