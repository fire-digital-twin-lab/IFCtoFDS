name: Conversion correctness
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q -m "not solver"
      - run: python -m ifc_to_fds --help
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/app-controller.js
      - run: node --check js/verified-workflow.js
      - run: node scripts/test-verified-regressions.js
      - run: node scripts/test-geom-opening-regression.js
      - run: node scripts/test-background-export-worker.js
      - run: node scripts/generate-inline-parse-worker.js
      - run: node scripts/generate-inline-export-worker.js
      - run: git diff --exit-code -- js/workers/*-inline.js
  solver:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, fds-6.11.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -m solver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solver-evidence
          path: scripts/out/solver-evidence/
